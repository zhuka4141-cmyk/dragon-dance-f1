name: Keep Supabase active

on:
  schedule:
    # Run once a day during Hong Kong daytime (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the updates table
        env:
          SUPABASE_URL: https://csnleawnckocalvggvdf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsO3Sp3qZ1mxONkthTBCTA_byc0BCU_
        run: |
          set -euo pipefail
          response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Cache-Control: no-cache' \
            "${SUPABASE_URL}/rest/v1/updates?select=id&limit=1")"
          echo "Supabase responded successfully (${#response} bytes)."
