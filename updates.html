<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Latest news and progress from Dragon Dance STEM Racing in Hong Kong." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lstc-dragon-dance.vercel.app/updates.html" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/dragon-icon-48.png" />
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="assets/dragon-icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <title>Latest Updates | Dragon Dance STEM Racing</title>
  <style>
    :root { --ink:#080808; --paper:#f2f2ef; --line:#30302e; --muted:#a6a6a1; --red:#e01823; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--ink); color:var(--paper); font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif; }
    html[lang="zh-Hant"] body { font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .topline { height:6px; background:repeating-linear-gradient(90deg,var(--paper) 0 20px,var(--ink) 20px 40px); }
    nav { min-height:76px; display:flex; align-items:center; justify-content:space-between; gap:25px; padding:0 4.2vw; border-bottom:1px solid var(--line); }
    .wordmark { flex:0 0 auto; font-family:Impact,"Arial Narrow",sans-serif; font-size:27px; letter-spacing:1px; line-height:.75; text-transform:uppercase; }
    .wordmark span { display:block; margin-left:2px; color:var(--red); font-size:11px; letter-spacing:3px; }
    .back-home { margin-left:auto; color:#d2d2cd; font-size:11px; font-weight:bold; letter-spacing:1.2px; text-transform:uppercase; transition:color .2s; }
    .back-home:hover, .back-home:focus-visible { color:var(--red); outline:0; }
    .language-switch { display:inline-flex; align-items:center; gap:5px; font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; line-height:1; }
    .language-switch button { min-width:28px; padding:8px 1px; border:0; border-bottom:1px solid transparent; background:transparent; color:#858582; font:inherit; cursor:pointer; transition:color .2s,border-color .2s; }
    #langChinese { font-family:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",sans-serif; font-size:11px; font-weight:900; letter-spacing:0; -webkit-text-stroke:.15px currentColor; }
    .language-switch button:hover, .language-switch button:focus-visible { color:var(--paper); outline:0; }
    .language-switch button[aria-pressed="true"] { color:var(--paper); border-bottom-color:var(--red); }
    .language-divider { color:#555; }
    .updates-hero { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr); gap:80px; min-height:390px; align-items:end; padding:clamp(70px,9vw,135px) 4.2vw 60px; border-bottom:1px solid var(--line); background:linear-gradient(120deg,#121212 0 68%,#1d1d1b 68% 100%); }
    .eyebrow { color:var(--red); font-size:11px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; }
    h1 { max-width:800px; margin:15px 0 0; font-family:Impact,"Arial Narrow",sans-serif; font-size:clamp(64px,11vw,164px); font-weight:400; line-height:.79; letter-spacing:1px; text-transform:uppercase; }
    .updates-hero p { max-width:430px; margin:0; color:#c8c8c4; font-size:16px; line-height:1.65; }
    .updates-archive { padding:clamp(60px,8vw,112px) 4.2vw; background:var(--paper); color:var(--ink); }
    .updates-list { display:grid; gap:0; }
    .update-entry { display:grid; grid-template-columns:minmax(280px,.9fr) minmax(0,1.1fr); gap:clamp(32px,6vw,110px); align-items:start; padding:clamp(34px,5vw,70px) 0; border-top:1px solid #999; scroll-margin-top:30px; transition:background .25s; }
    .update-entry.is-target { background:#e7e7e2; }
    .update-media { position:relative; display:block; width:100%; aspect-ratio:4 / 3; overflow:hidden; border:0; padding:0; background:#d6d6d1; cursor:zoom-in; touch-action:pan-y; }
    .update-media:focus-visible { outline:3px solid var(--red); outline-offset:4px; }
    .update-slide { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; filter:grayscale(.18) contrast(1.05); transform:scale(1.02); transition:opacity .7s ease,filter .35s,transform .7s ease; }
    .update-slide.is-active { opacity:1; transform:scale(1); }
    .update-entry:hover .update-slide.is-active { filter:grayscale(0) contrast(1.05); }
    .carousel-count { position:absolute; right:12px; bottom:12px; z-index:1; padding:5px 7px; background:rgba(8,8,8,.65); color:var(--paper); font-size:10px; font-weight:bold; letter-spacing:1px; }
    .update-pin { display:inline-block; margin:0 0 10px; padding:4px 6px; border:1px solid var(--red); color:var(--red); font-size:9px; font-weight:bold; letter-spacing:1.1px; text-transform:uppercase; }
    .update-date { display:block; margin-bottom:18px; color:var(--red); font-size:10px; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase; }
    .update-entry h2 { max-width:780px; margin:0; font-family:Impact,"Arial Narrow",sans-serif; font-size:clamp(40px,5vw,78px); font-weight:400; line-height:.85; letter-spacing:1px; text-transform:uppercase; }
    .update-body { max-width:670px; margin-top:28px; }
    .update-body p { margin:0 0 16px; color:#51514d; font-size:15px; line-height:1.7; }
    .gallery-overlay { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:22px; background:rgba(0,0,0,.88); }
    .gallery-dialog { position:relative; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; width:min(1120px,100%); max-height:100%; }
    .gallery-image { display:grid; place-items:center; width:100%; height:min(72vh,780px); background:#080808; }
    .gallery-stage-media { display:block; width:100%; height:100%; object-fit:contain; }
    .gallery-close, .gallery-nav { position:absolute; z-index:1; display:grid; place-items:center; width:44px; height:44px; border:1px solid rgba(242,242,239,.65); border-radius:0; background:rgba(8,8,8,.68); color:var(--paper); font-size:25px; line-height:1; }
    .gallery-close { top:12px; right:12px; }
    .gallery-nav { top:50%; transform:translateY(-50%); }
    .gallery-nav.prev { left:12px; }
    .gallery-nav.next { right:12px; }
    .gallery-close:hover, .gallery-close:focus-visible, .gallery-nav:hover, .gallery-nav:focus-visible { border-color:var(--red); background:var(--red); outline:0; }
    .gallery-thumbnails { display:flex; gap:8px; overflow:auto; padding-bottom:3px; }
    .gallery-thumb { position:relative; flex:0 0 72px; height:54px; overflow:hidden; border:1px solid transparent; border-radius:0; padding:0; background:#202020; }
    .gallery-thumb.is-active { border-color:var(--red); }
    .gallery-thumb img, .gallery-thumb video { width:100%; height:100%; object-fit:cover; }
    body.has-gallery { overflow:hidden; }
    .updates-status { padding:46px 0; border-top:1px solid #999; color:#555; font-size:16px; }
    footer { display:flex; align-items:end; justify-content:space-between; gap:25px; padding:34px 4.2vw 24px; background:var(--paper); color:var(--ink); border-top:1px solid #a4a4a0; }
    footer strong { font-family:Impact,"Arial Narrow",sans-serif; font-size:clamp(30px,4vw,52px); font-weight:400; line-height:.8; letter-spacing:1px; text-transform:uppercase; }
    footer span { color:#555; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; }
    @media (max-width:800px) { nav { min-height:63px; } .back-home { font-size:10px; } .updates-hero { grid-template-columns:1fr; min-height:0; gap:28px; padding:75px 6vw 54px; } .updates-hero p { font-size:15px; } .updates-archive { padding:60px 6vw; } .update-entry { grid-template-columns:1fr; gap:26px; padding:45px 0; } .update-excerpt { font-size:17px; } footer { align-items:start; flex-direction:column; padding:30px 6vw 22px; } }
  </style>
</head>
<body>
  <div class="topline"></div>
  <nav>
    <a class="wordmark" href="index.html">Dragon Dance<span>STEM Racing</span></a>
    <a class="back-home" href="index.html#updates" data-i18n="backHome">Home</a>
    <div class="language-switch" role="group" aria-label="Language selector">
      <button id="langEnglish" type="button" aria-pressed="true">EN</button><span class="language-divider" aria-hidden="true">/</span><button id="langChinese" type="button" aria-pressed="false">中文</button>
    </div>
  </nav>
  <main>
    <section class="updates-hero" aria-labelledby="updatesTitle">
      <div><div class="eyebrow" data-i18n="updatesLabel">Latest / Updates</div><h1 id="updatesTitle" data-i18n-html="updatesTitle">On The<br>Move.</h1></div>
      <p data-i18n="updatesIntro">News, race preparation and the moments that move Dragon Dance forward.</p>
    </section>
    <section class="updates-archive" aria-live="polite" aria-labelledby="updatesTitle">
      <div class="updates-list" id="updatesList"><p class="updates-status" data-i18n="loading">Loading updates...</p></div>
    </section>
  </main>
  <footer><strong data-i18n-html="footerTitle">Dance with<br>the dragon.</strong><span>Dragon Dance / STEM Racing · Hong Kong</span></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (() => {
      const updatesList = document.getElementById('updatesList');
      const english = Object.fromEntries(Array.from(document.querySelectorAll('[data-i18n]')).map(element => [element.dataset.i18n, element.textContent]));
      const englishHtml = Object.fromEntries(Array.from(document.querySelectorAll('[data-i18n-html]')).map(element => [element.dataset.i18nHtml, element.innerHTML]));
      const chinese = {
        backHome:'首頁', updatesLabel:'最新 / 動態', updatesIntro:'分享隊伍消息、備賽進度，以及推動 Dragon Dance 前進的每一個時刻。', loading:'正在載入動態...', empty:'暫時未有動態，請稍後再回來看看。', footerTitle:'與龍<br>共舞。'
      };
      const chineseHtml = { updatesTitle:'持續<br>前進。', footerTitle:'與龍<br>共舞。' };
      const langEnglish = document.getElementById('langEnglish');
      const langChinese = document.getElementById('langChinese');
      const updatesDatabase = window.supabase.createClient(window.DRAGON_DANCE_SUPABASE.url, window.DRAGON_DANCE_SUPABASE.publishableKey);
      let language = 'en';
      let updates = [];
      let carouselTimers = [];

      function mapUpdate(row) {
        const images = normaliseMediaEntries(row);
        return {
          id:row.slug,
          published:row.published_at,
          isPinned:Boolean(row.is_pinned),
          cover:images[0] || row.cover_url,
          images,
          title:{ en:row.title_en, zh:row.title_zh },
          body:{ en:row.body_en, zh:row.body_zh }
        };
      }

      function postText(post, field) {
        const value = post[field];
        if (typeof value === 'string') return value;
        return value?.[language] || value?.en || '';
      }

      function formatDate(value) {
        const date = new Date(`${value}T12:00:00`);
        if (Number.isNaN(date.getTime())) return value || '';
        return new Intl.DateTimeFormat(language === 'zh' ? 'zh-HK' : 'en-GB', { day:'2-digit', month:'long', year:'numeric' }).format(date);
      }

      function isVideoUrl(url) {
        return /\.(?:mp4|webm|ogg)(?:[?#].*)?$/i.test(String(url || ''));
      }

      function parseMediaEntry(value) {
        if (typeof value !== 'string') return value;
        const trimmed = value.trim();
        if (!trimmed.startsWith('{')) return value;
        try {
          const parsed = JSON.parse(trimmed);
          return parsed && typeof parsed.url === 'string' ? parsed : value;
        } catch {
          return value;
        }
      }

      function mediaUrl(entry) {
        const value = parseMediaEntry(entry);
        if (typeof value === 'string') return value;
        const url = parseMediaEntry(value?.url);
        return typeof url === 'string' ? url : url?.url || '';
      }

      function normaliseMediaPosition(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.min(100, Math.max(0, number)) : 50;
      }

      function normaliseMediaEntries(row) {
        const raw = Array.isArray(row?.image_urls) ? row.image_urls : [];
        const entries = raw.map(value => {
          value = parseMediaEntry(value);
          if (typeof value === 'string') return { url:value, positionX:50, positionY:50, scale:1 };
          if (!value || typeof value.url !== 'string') return null;
          return {
            ...value,
            positionX:normaliseMediaPosition(value.positionX ?? value.position_x ?? 50),
            positionY:normaliseMediaPosition(value.positionY ?? value.position_y ?? 50),
            scale:Math.min(3, Math.max(1, Number(value.scale ?? 1) || 1))
          };
        }).filter(Boolean);
        const coverUrl = mediaUrl(row?.cover_url);
        if (!entries.length && coverUrl) entries.push({ url:coverUrl, positionX:50, positionY:50, scale:1 });
        const seen = new Set();
        return entries.filter(entry => {
          const url = mediaUrl(entry);
          if (!url || seen.has(url)) return false;
          seen.add(url);
          return true;
        });
      }

      function mediaNaturalSize(media) {
        const video = media?.tagName === 'VIDEO';
        const width = video ? media.videoWidth : media.naturalWidth;
        const height = video ? media.videoHeight : media.naturalHeight;
        return width > 0 && height > 0 ? { width, height } : null;
      }

      function layoutCroppedMedia(media, entry, frame = media?.parentElement) {
        const natural = mediaNaturalSize(media);
        const frameWidth = frame?.clientWidth || 0;
        const frameHeight = frame?.clientHeight || 0;
        if (!entry || !natural || !frameWidth || !frameHeight) return;
        const scale = Math.min(3, Math.max(1, Number(entry.scale) || 1));
        const baseScale = Math.max(frameWidth / natural.width, frameHeight / natural.height);
        const width = natural.width * baseScale * scale;
        const height = natural.height * baseScale * scale;
        const overflowX = Math.max(0, width - frameWidth);
        const overflowY = Math.max(0, height - frameHeight);
        const positionX = normaliseMediaPosition(entry.positionX);
        const positionY = normaliseMediaPosition(entry.positionY);
        media.style.position = 'absolute';
        media.style.inset = 'auto';
        media.style.left = `${overflowX ? -(overflowX * positionX / 100) : (frameWidth - width) / 2}px`;
        media.style.top = `${overflowY ? -(overflowY * positionY / 100) : (frameHeight - height) / 2}px`;
        media.style.width = `${width}px`;
        media.style.height = `${height}px`;
        media.style.maxWidth = 'none';
        media.style.maxHeight = 'none';
        media.style.objectFit = 'fill';
        media.style.objectPosition = '50% 50%';
        media.style.transform = 'none';
      }

      function applyMediaLayout(media, entry) {
        if (!entry) return;
        media._cropEntry = entry;
        media.dataset.croppedMedia = 'true';
        const layout = () => layoutCroppedMedia(media, media._cropEntry);
        if (!media._cropLayoutBound) {
          media.addEventListener(media.tagName === 'VIDEO' ? 'loadedmetadata' : 'load', layout);
          media._cropLayoutBound = true;
        }
        window.requestAnimationFrame(layout);
      }

      let mediaLayoutResizeFrame = 0;
      window.addEventListener('resize', () => {
        window.cancelAnimationFrame(mediaLayoutResizeFrame);
        mediaLayoutResizeFrame = window.requestAnimationFrame(() => {
          document.querySelectorAll('[data-cropped-media="true"]').forEach(media => {
            layoutCroppedMedia(media, media._cropEntry);
          });
        });
      });

      function clearCarousels() {
        carouselTimers.forEach(timer => window.clearInterval(timer));
        carouselTimers = [];
      }

      function openGallery(images, title, startIndex) {
        let activeIndex = startIndex;
        const overlay = document.createElement('div');
        overlay.className = 'gallery-overlay';
        overlay.setAttribute('role', 'presentation');
        const dialog = document.createElement('section');
        dialog.className = 'gallery-dialog';
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('aria-label', title);
        const stage = document.createElement('div');
        stage.className = 'gallery-image';
        const close = document.createElement('button');
        close.className = 'gallery-close';
        close.type = 'button';
        close.textContent = '×';
        close.setAttribute('aria-label', 'Close gallery');
        const previous = document.createElement('button');
        previous.className = 'gallery-nav prev';
        previous.type = 'button';
        previous.textContent = '←';
        previous.setAttribute('aria-label', 'Previous image');
        const next = document.createElement('button');
        next.className = 'gallery-nav next';
        next.type = 'button';
        next.textContent = '→';
        next.setAttribute('aria-label', 'Next image');
        const thumbnails = document.createElement('div');
        thumbnails.className = 'gallery-thumbnails';
        const thumbButtons = images.map((entry, index) => {
          const thumb = document.createElement('button');
          thumb.className = 'gallery-thumb';
          thumb.type = 'button';
          thumb.setAttribute('aria-label', `View image ${index + 1}`);
          const url = mediaUrl(entry);
          const thumbMedia = isVideoUrl(url) ? document.createElement('video') : document.createElement('img');
          thumbMedia.src = url;
          thumbMedia.alt = '';
          thumbMedia.loading = 'lazy';
          applyMediaLayout(thumbMedia, entry);
          if (thumbMedia.tagName === 'VIDEO') {
            thumbMedia.muted = true;
            thumbMedia.playsInline = true;
          }
          thumb.append(thumbMedia);
          thumb.addEventListener('click', () => showImage(index));
          thumbnails.append(thumb);
          return thumb;
        });
        function showImage(index) {
          activeIndex = (index + images.length) % images.length;
          const entry = images[activeIndex];
          const url = mediaUrl(entry);
          const media = isVideoUrl(url) ? document.createElement('video') : document.createElement('img');
          media.className = 'gallery-stage-media';
          media.src = url;
          if (media.tagName === 'VIDEO') {
            media.controls = true;
            media.autoplay = true;
            media.loop = true;
            media.muted = true;
            media.playsInline = true;
          } else {
            media.alt = `${title} ${activeIndex + 1}`;
          }
          stage.replaceChildren(media);
          thumbButtons.forEach((thumb, thumbIndex) => thumb.classList.toggle('is-active', thumbIndex === activeIndex));
        }
        function closeGallery() {
          document.removeEventListener('keydown', onKeydown);
          document.body.classList.remove('has-gallery');
          overlay.remove();
        }
        function onKeydown(event) {
          if (event.key === 'Escape') closeGallery();
          if (event.key === 'ArrowLeft') showImage(activeIndex - 1);
          if (event.key === 'ArrowRight') showImage(activeIndex + 1);
        }
        close.addEventListener('click', closeGallery);
        previous.addEventListener('click', () => showImage(activeIndex - 1));
        next.addEventListener('click', () => showImage(activeIndex + 1));
        overlay.addEventListener('click', event => { if (event.target === overlay) closeGallery(); });
        if (images.length === 1) {
          previous.hidden = true;
          next.hidden = true;
          thumbnails.hidden = true;
        }
        dialog.append(stage, close, previous, next, thumbnails);
        overlay.append(dialog);
        document.body.append(overlay);
        document.body.classList.add('has-gallery');
        document.addEventListener('keydown', onKeydown);
        showImage(activeIndex);
        close.focus();
      }

      function createCarousel(post) {
        let activeIndex = 0;
        const media = document.createElement('button');
        media.className = 'update-media';
        media.type = 'button';
        media.setAttribute('aria-label', `Open media gallery: ${postText(post, 'title')}`);
        const slides = post.images.map((entry, index) => {
          const url = mediaUrl(entry);
          const slide = isVideoUrl(url) ? document.createElement('video') : document.createElement('img');
          slide.className = `update-slide${index === 0 ? ' is-active' : ''}`;
          slide.src = url;
          slide.decoding = 'async';
          applyMediaLayout(slide, entry);
          if (slide.tagName === 'VIDEO') {
            slide.muted = true;
            slide.loop = true;
            slide.autoplay = index === 0;
            slide.playsInline = true;
            slide.preload = index === 0 ? 'auto' : 'metadata';
          } else {
            slide.alt = index === 0 ? postText(post, 'title') : '';
            slide.loading = index === 0 ? 'eager' : 'lazy';
          }
          media.append(slide);
          return slide;
        });
        function showSlide(index) {
          activeIndex = (index + slides.length) % slides.length;
          slides.forEach((slide, slideIndex) => {
            const isActive = slideIndex === activeIndex;
            slide.classList.toggle('is-active', isActive);
            if (slide.tagName === 'VIDEO') {
              if (isActive) slide.play().catch(() => {});
              else slide.pause();
            }
          });
          if (count) count.textContent = `${activeIndex + 1} / ${slides.length}`;
        }
        let count = null;
        if (slides.length > 1) {
          count = document.createElement('span');
          count.className = 'carousel-count';
          count.textContent = `1 / ${slides.length}`;
          media.append(count);
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            carouselTimers.push(window.setInterval(() => showSlide(activeIndex + 1), 4500));
          }
        }
        media.addEventListener('click', () => openGallery(post.images, postText(post, 'title'), activeIndex));
        return media;
      }

      function renderUpdates() {
        clearCarousels();
        updatesList.replaceChildren();
        if (!updates.length) {
          const status = document.createElement('p');
          status.className = 'updates-status';
          status.textContent = language === 'zh' ? chinese.empty : 'No updates have been published yet. Check back soon.';
          updatesList.append(status);
          return;
        }
        updates.forEach(post => {
          const entry = document.createElement('article');
          entry.className = 'update-entry';
          entry.id = post.id || '';
          if (window.location.hash === `#${post.id}`) entry.classList.add('is-target');
          if (post.images.length) entry.append(createCarousel(post));
          const copy = document.createElement('div');
          if (post.isPinned) {
            const pin = document.createElement('span');
            pin.className = 'update-pin';
            pin.textContent = language === 'zh' ? '置頂' : 'Pinned';
            copy.append(pin);
          }
          const date = document.createElement('time');
          date.className = 'update-date';
          date.dateTime = post.published || '';
          date.textContent = formatDate(post.published);
          const title = document.createElement('h2');
          title.textContent = postText(post, 'title');
          const body = document.createElement('div');
          body.className = 'update-body';
          postText(post, 'body').split(/\n\s*\n/).filter(Boolean).forEach(paragraph => {
            const line = document.createElement('p');
            line.textContent = paragraph;
            body.append(line);
          });
          copy.append(date, title, body);
          entry.append(copy);
          updatesList.append(entry);
        });
        const target = window.location.hash && document.getElementById(window.location.hash.slice(1));
        if (target) target.scrollIntoView({ block:'start' });
      }

      function applyLanguage(next) {
        language = next === 'zh' ? 'zh' : 'en';
        const text = language === 'zh' ? chinese : english;
        const html = language === 'zh' ? chineseHtml : englishHtml;
        document.querySelectorAll('[data-i18n]').forEach(element => { const value = text[element.dataset.i18n]; if (value) element.textContent = value; });
        document.querySelectorAll('[data-i18n-html]').forEach(element => { const value = html[element.dataset.i18nHtml]; if (value) element.innerHTML = value; });
        document.documentElement.lang = language === 'zh' ? 'zh-Hant' : 'en';
        langEnglish.setAttribute('aria-pressed', String(language === 'en'));
        langChinese.setAttribute('aria-pressed', String(language === 'zh'));
        try { window.localStorage.setItem('dragon-dance-language', language); } catch (_) {}
        renderUpdates();
      }

      try { language = window.localStorage.getItem('dragon-dance-language') === 'zh' ? 'zh' : 'en'; } catch (_) {}
      applyLanguage(language);
      updatesDatabase
        .from('updates')
        .select('slug,published_at,title_en,title_zh,body_en,body_zh,cover_url,image_urls,is_pinned')
        .eq('is_published', true)
        .order('is_pinned', { ascending:false })
        .order('published_at', { ascending:false })
        .then(({ data, error }) => { updates = error ? [] : data.map(mapUpdate); renderUpdates(); })
        .catch(() => { updates = []; renderUpdates(); });
      langEnglish.addEventListener('click', () => applyLanguage('en'));
      langChinese.addEventListener('click', () => applyLanguage('zh'));
    })();
  </script>
</body>
</html>
