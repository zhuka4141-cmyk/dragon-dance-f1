backend:
  name: github
  repo: zhuka4141-cmyk/dragon-dance-f1
  branch: main
  base_url: https://lstc-dragon-dance.vercel.app
  auth_endpoint: api/auth

media_folder: assets/updates
public_folder: /assets/updates

collections:
  - name: updates
    label: 最新動態
    files:
      - name: feed
        label: 動態內容
        file: content/updates.json
        fields:
          - name: posts
            label: 所有動態
            widget: list
            summary: "{{fields.published}} - {{fields.title.en}}"
            fields:
              - name: id
                label: 網址識別名稱
                widget: string
                hint: "使用英文小寫與連字號，例如 race-day-2026。每則動態不可重複。"
              - name: published
                label: 發布日期
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                format: YYYY-MM-DD
              - name: cover
                label: 封面圖片
                widget: image
                required: false
              - name: alt
                label: 圖片描述
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: string
                  - name: zh
                    label: 中文
                    widget: string
              - name: title
                label: 標題
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: string
                  - name: zh
                    label: 中文
                    widget: string
              - name: excerpt
                label: 摘要
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: text
                  - name: zh
                    label: 中文
                    widget: text
              - name: body
                label: 內文
                widget: object
                fields:
                  - name: en
                    label: English
                    widget: text
                  - name: zh
                    label: 中文
                    widget: text
